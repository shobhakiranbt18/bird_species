<!DOCTYPE html>
<html>
<head>
    <title>Bird Species Prediction</title>
</head>
<body>

<h2>Bird Species Identification</h2>

<form method="POST" enctype="multipart/form-data">
    <input type="file" name="image" required>
    <br><br>
    <button type="submit">Predict</button>
</form>

{% if image_filename %}
    <h3>Predicted Bird: {{ prediction }}</h3>
    <img src="{{ url_for('static', filename='uploads/' + image_filename) }}" width="400">
{% endif %}

</body>
</html>
